syntax = "proto3";

package battle_arena.protocol.v1;
option csharp_namespace = "BattleArena.Protocol.V1";

import "client_commands.proto";

// A command after the authority has associated it with an authenticated
// session peer and selected the exact simulation tick on which it was used.
message AuthorityAcceptedMovementCommand {
  fixed64 source_session_peer_id = 1;
  uint32 peer_session_generation = 2;
  fixed64 combatant_id = 3;
  fixed64 life_id = 4;
  uint64 applied_authority_tick = 5;
  ClientInputFrame input = 6;
  uint64 applied_movement_profile_revision = 7;
  uint64 applied_movement_capability_revision = 8;
}

// Recent accepted commands are repeated across packets. Application-level
// identity and sequence fields make the unreliable stream safe to deduplicate.
message AuthorityAcceptedMovementBatch {
  uint64 stream_sequence = 1;
  repeated AuthorityAcceptedMovementCommand commands = 2;
}
