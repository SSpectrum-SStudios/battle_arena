syntax = "proto3";

package battle_arena.protocol.v1;
option csharp_namespace = "BattleArena.Protocol.V1";

message Vector3Value {
  float x = 1;
  float y = 2;
  float z = 3;
}

message ReplicatedStateRevision {
  uint64 match_revision = 1;
  uint64 entity_revision = 2;
  uint64 effect_revision = 3;
  uint64 world_object_revision = 4;
}

enum ClientActionKind {
  CLIENT_ACTION_KIND_UNSPECIFIED = 0;
  CLIENT_ACTION_KIND_ATTACK = 1;
  CLIENT_ACTION_KIND_ACTIVATE_ITEM = 2;
}

enum ReplicatedLifeState {
  REPLICATED_LIFE_STATE_UNSPECIFIED = 0;
  REPLICATED_LIFE_STATE_ALIVE = 1;
  REPLICATED_LIFE_STATE_ELIMINATED = 2;
  REPLICATED_LIFE_STATE_RESPAWNING = 3;
  REPLICATED_LIFE_STATE_OUT_OF_LIVES = 4;
  REPLICATED_LIFE_STATE_DISCONNECTED = 5;
}

enum EffectLifecycleKind {
  EFFECT_LIFECYCLE_KIND_UNSPECIFIED = 0;
  EFFECT_LIFECYCLE_KIND_ADDED = 1;
  EFFECT_LIFECYCLE_KIND_UPDATED = 2;
  EFFECT_LIFECYCLE_KIND_REMOVED = 3;
}

enum ReplicatedLocomotionMode {
  REPLICATED_LOCOMOTION_MODE_UNSPECIFIED = 0;
  REPLICATED_LOCOMOTION_MODE_GROUNDED = 1;
  REPLICATED_LOCOMOTION_MODE_AIRBORNE = 2;
  REPLICATED_LOCOMOTION_MODE_ROLLING = 3;
  REPLICATED_LOCOMOTION_MODE_MANTLING = 4;
  REPLICATED_LOCOMOTION_MODE_DISABLED = 5;
}

enum ReplicatedPostureMode {
  REPLICATED_POSTURE_MODE_UNSPECIFIED = 0;
  REPLICATED_POSTURE_MODE_STANDING = 1;
  REPLICATED_POSTURE_MODE_CROUCHED = 2;
}

enum ReplicatedMovementActionMode {
  REPLICATED_MOVEMENT_ACTION_MODE_UNSPECIFIED = 0;
  REPLICATED_MOVEMENT_ACTION_MODE_READY = 1;
  REPLICATED_MOVEMENT_ACTION_MODE_ATTACKING = 2;
  REPLICATED_MOVEMENT_ACTION_MODE_BLOCKING = 3;
  REPLICATED_MOVEMENT_ACTION_MODE_USING_ITEM = 4;
  REPLICATED_MOVEMENT_ACTION_MODE_STUNNED = 5;
}

enum ReplicatedJumpPhase {
  REPLICATED_JUMP_PHASE_UNSPECIFIED = 0;
  REPLICATED_JUMP_PHASE_NONE = 1;
  REPLICATED_JUMP_PHASE_RISING = 2;
  REPLICATED_JUMP_PHASE_APEX = 3;
  REPLICATED_JUMP_PHASE_FALLING = 4;
}

enum ReplicatedTraversalPhase {
  REPLICATED_TRAVERSAL_PHASE_UNSPECIFIED = 0;
  REPLICATED_TRAVERSAL_PHASE_REACHING = 1;
  REPLICATED_TRAVERSAL_PHASE_HANGING = 2;
  REPLICATED_TRAVERSAL_PHASE_MANTLING = 3;
}

message ReplicatedTraversalState {
  uint64 traversal_instance_id = 1;
  ReplicatedTraversalPhase phase = 2;
  Vector3Value ledge_anchor = 3;
  Vector3Value ledge_normal = 4;
  uint64 phase_elapsed_ticks = 5;
  uint64 phase_duration_ticks = 6;
}

// Protocol-next draft primitives. They are deliberately not routed by the v1
// PacketEnvelope until the coordinated protocol-version gate.
message OwnerPredictionScopeDraft {
  uint64 match_frame_epoch = 1;
  fixed64 combatant_id = 2;
  fixed64 life_id = 3;
  uint64 authority_discontinuity_id = 4;
  uint64 owner_control_epoch = 5;
  fixed64 session_id = 6;
}

message SelectiveSequenceAcknowledgementDraft {
  optional uint64 highest_contiguous_sequence = 1;
  fixed64 following_64_received_mask = 2;
}

enum OwnerMovementTransitionKindDraft {
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_UNSPECIFIED = 0;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_JUMP_PRESSED = 1;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_JUMP_RELEASED = 2;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_CROUCH_OR_ROLL_PRESSED = 3;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_CROUCH_OR_ROLL_RELEASED = 4;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_LEDGE_GRAB = 5;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_LEDGE_CLIMB = 6;
  OWNER_MOVEMENT_TRANSITION_KIND_DRAFT_LEDGE_DROP = 7;
}

enum OwnerActionTriggerDraft {
  OWNER_ACTION_TRIGGER_DRAFT_UNSPECIFIED = 0;
  OWNER_ACTION_TRIGGER_DRAFT_ATTACK = 1;
  OWNER_ACTION_TRIGGER_DRAFT_BLOCK = 2;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_WEAPON = 3;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_HELMET = 4;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_CHEST_ARMOR = 5;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_GLOVES = 6;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_BOOTS = 7;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_AMULET = 8;
  OWNER_ACTION_TRIGGER_DRAFT_ACTIVATE_SELECTED_FLEXIBLE_ITEM = 9;
}

enum OwnerInputFrameDispositionKindDraft {
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_UNSPECIFIED = 0;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_RECEIVED_COMMAND = 1;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_REPEATED_CONTINUOUS_FALLBACK = 2;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_NEUTRAL_FALLBACK = 3;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_REJECTED_COMMAND = 4;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_LATE_COMMAND = 5;
  OWNER_INPUT_FRAME_DISPOSITION_KIND_DRAFT_AUTHORITY_OVERRIDE = 6;
}

enum OwnerPredictionBootstrapKindDraft {
  OWNER_PREDICTION_BOOTSTRAP_KIND_DRAFT_UNSPECIFIED = 0;
  OWNER_PREDICTION_BOOTSTRAP_KIND_DRAFT_PRE_MATCH = 1;
  OWNER_PREDICTION_BOOTSTRAP_KIND_DRAFT_RECONNECT = 2;
  OWNER_PREDICTION_BOOTSTRAP_KIND_DRAFT_RESPAWN = 3;
  OWNER_PREDICTION_BOOTSTRAP_KIND_DRAFT_TIMELINE_REBASE = 4;
}

enum OwnerPredictionBaselinePreparationDraft {
  OWNER_PREDICTION_BASELINE_PREPARATION_DRAFT_UNSPECIFIED = 0;
  OWNER_PREDICTION_BASELINE_PREPARATION_DRAFT_FROZEN_COMMAND_PREDECESSOR = 1;
  OWNER_PREDICTION_BASELINE_PREPARATION_DRAFT_NEUTRAL_PREROLL = 2;
}

enum OwnerPredictionBaselineSourceDraft {
  OWNER_PREDICTION_BASELINE_SOURCE_DRAFT_UNSPECIFIED = 0;
  OWNER_PREDICTION_BASELINE_SOURCE_DRAFT_SPAWN = 1;
  OWNER_PREDICTION_BASELINE_SOURCE_DRAFT_SNAPSHOT = 2;
  OWNER_PREDICTION_BASELINE_SOURCE_DRAFT_AUTHORITY_MOVEMENT = 3;
}
